name: SIGNIA checked image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: signia-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/cjorence/signia-backend-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
          persist-credentials: false
      - name: Test Laravel with a temporary key and SQLite
        working-directory: source
        run: |
          sudo update-alternatives --set php /usr/bin/php8.3
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg php8.3-sqlite3
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --force
          php artisan test
          composer audit --locked --no-dev
      - name: Build production image
        working-directory: source
        run: docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "com.signia.ref=$GITHUB_REF" -t "$IMAGE:$GITHUB_SHA" .
      - name: Publish tested revision if it is still the release branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha() { gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'; }
          head=$(head_sha)
          [[ "$head" == "$GITHUB_SHA" ]] || { echo 'Superseded release; skipping publish.'; exit 0; }
          package=${IMAGE##*/}
          inspect_package() {
            curl --silent --show-error --retry 2 -o "$RUNNER_TEMP/signia-package.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package"
          }
          code=$(inspect_package)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$code" == 404 ]]; then
            # Establish visibility using an empty image before publishing any application layers.
            printf 'FROM scratch\nLABEL com.signia.bootstrap=true\n' | docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:visibility-check" -
            docker push "$IMAGE:visibility-check"
            for attempt in {1..12}; do
              code=$(inspect_package)
              [[ "$code" != 404 ]] && break
              sleep 5
            done
          fi
          [[ "$code" == 200 ]] || { echo "Package metadata unavailable (HTTP $code); application image withheld."; exit 1; }
          visibility=$(jq -r '.visibility' "$RUNNER_TEMP/signia-package.json")
          [[ "$visibility" == private ]] || { echo "Package visibility is $visibility; application image withheld."; exit 1; }
          echo 'Private backend release package verified.'
          docker push "$IMAGE:$GITHUB_SHA"
          head=$(head_sha)
          [[ "$head" == "$GITHUB_SHA" ]] || { echo 'Newer commit pending; keeping prior checked image.'; exit 0; }
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:checked"
          docker push "$IMAGE:checked"
