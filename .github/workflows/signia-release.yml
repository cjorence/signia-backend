name: SIGNIA checked image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: signia-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/cjorence/signia-backend-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
          persist-credentials: false
      - name: Test Laravel with a temporary key and SQLite
        working-directory: source
        run: |
          sudo update-alternatives --set php /usr/bin/php8.3
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg php8.3-sqlite3
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --force
          php artisan test
          composer audit --locked --no-dev
      - name: Build production image
        working-directory: source
        run: docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "com.signia.ref=$GITHUB_REF" -t "$IMAGE:$GITHUB_SHA" .
      - name: Publish tested revision if it is still the release branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha() { gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'; }
          head=$(head_sha)
          [[ "$head" == "$GITHUB_SHA" ]] || { echo 'Superseded release; skipping publish.'; exit 0; }
          package=${IMAGE##*/}
          inspect_package() {
            curl --silent --show-error --retry 2 -o "$RUNNER_TEMP/signia-package.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package"
          }
          code=$(inspect_package)
          case "$code" in
            200) jq -e '.visibility == "private"' "$RUNNER_TEMP/signia-package.json" >/dev/null || { echo 'Package is public; application image withheld.'; exit 1; } ;;
            404) ;; # GitHub's named-user metadata endpoint describes public packages.
            *) echo "Package metadata check failed (HTTP $code)"; exit 1 ;;
          esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf 'FROM scratch\nLABEL com.signia.bootstrap=true\n' | docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:visibility-check" -
          docker push "$IMAGE:visibility-check"
          docker manifest inspect "$IMAGE:visibility-check" >/dev/null
          # Confirm anonymous access to the same existing tag is denied. A 404,
          # connectivity error or missing manifest does not establish privacy.
          path=${IMAGE#ghcr.io/}
          anon=$(curl -sS --retry 2 -o "$RUNNER_TEMP/signia-anon.json" -w '%{http_code}' "https://ghcr.io/token?scope=repository:$path:pull&service=ghcr.io")
          if [[ "$anon" == 200 ]]; then
            bearer=$(jq -er '.token' "$RUNNER_TEMP/signia-anon.json")
            anon=$(curl -sS --head --retry 2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $bearer" -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$path/manifests/visibility-check")
          fi
          case "$anon" in 401|403) echo 'Authenticated pull passed and anonymous pull denied.' ;; *) echo "Unexpected anonymous access (HTTP $anon); application image withheld."; exit 1 ;; esac
          docker push "$IMAGE:$GITHUB_SHA"
          head=$(head_sha)
          [[ "$head" == "$GITHUB_SHA" ]] || { echo 'Newer commit pending; keeping prior checked image.'; exit 0; }
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:checked"
          docker push "$IMAGE:checked"
