ServerName localhost
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Uploaded media must never be interpreted as PHP or override server rules.
    # Rules must match the symlink paths Apache uses, not only their targets.
    <Directory /var/www/html/public/storage>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/public/stories/covers>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /data/media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    LimitRequestBody 23068672
    Timeout 150
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
